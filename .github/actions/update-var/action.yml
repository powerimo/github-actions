name: Update config variable
description: Creates or updates a variable value in Powerimo Config service at a given scope

inputs:
  api-url:
    required: true
    description: Base URL of the config API (e.g. https://app.powerimo.cloud/config)
  api-key:
    required: true
    description: X-Api-Key value for authentication
  account-id:
    required: true
    description: Account UUID
  scope:
    required: false
    default: account
    description: "Variable scope: account | env | app | app-env | app-profile"
  var-name:
    required: true
    description: Variable name
  value:
    required: true
    description: New variable value
  security-level:
    required: false
    default: PUBLIC
    description: "Variable security level: PUBLIC | HIDDEN_BY_DEFAULT | ENCRYPTED"
  create:
    required: false
    default: "false"
    description: "Create the variable if it does not exist (account scope only)"
  ignore-rv:
    required: false
    default: "false"
    description: "Skip optimistic locking revision check — use with caution (account scope only)"
  env-name:
    required: false
    description: Environment name (required for scope env or app-env)
  app-name:
    required: false
    description: Application name (required for scope app, app-env, or app-profile)
  profile-name:
    required: false
    description: Profile name (required for scope app-profile)

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        API_URL: ${{ inputs.api-url }}
        ACCOUNT_ID: ${{ inputs.account-id }}
        SCOPE: ${{ inputs.scope }}
        VAR_NAME: ${{ inputs.var-name }}
        VAR_VALUE: ${{ inputs.value }}
        SECURITY_LEVEL: ${{ inputs.security-level }}
        CREATE_VAR: ${{ inputs.create }}
        IGNORE_RV: ${{ inputs.ignore-rv }}
        ENV_NAME: ${{ inputs.env-name }}
        APP_NAME: ${{ inputs.app-name }}
        PROFILE_NAME: ${{ inputs.profile-name }}
      run: |
        set -e

        BASE="${API_URL}/v1/account/${ACCOUNT_ID}"

        case "${SCOPE}" in
          account)
            URL="${BASE}/account-vars/${VAR_NAME}"
            BODY=$(jq -n \
              --arg name "${VAR_NAME}" \
              --arg value "${VAR_VALUE}" \
              --arg sl "${SECURITY_LEVEL}" \
              --argjson create "${CREATE_VAR}" \
              --argjson ignoreRv "${IGNORE_RV}" \
              '{"name":$name,"value":$value,"securityLevel":$sl,"create":$create,"ignoreRv":$ignoreRv}')
            ;;
          env)
            URL="${BASE}/envs/${ENV_NAME}/vars/${VAR_NAME}"
            BODY=$(jq -n \
              --arg name "${VAR_NAME}" \
              --arg value "${VAR_VALUE}" \
              --arg sl "${SECURITY_LEVEL}" \
              '{"name":$name,"value":$value,"securityLevel":$sl}')
            ;;
          app)
            URL="${BASE}/apps/${APP_NAME}/vars/${VAR_NAME}"
            BODY=$(jq -n \
              --arg name "${VAR_NAME}" \
              --arg value "${VAR_VALUE}" \
              --arg sl "${SECURITY_LEVEL}" \
              '{"name":$name,"value":$value,"securityLevel":$sl}')
            ;;
          app-env)
            URL="${BASE}/apps/${APP_NAME}/envs/${ENV_NAME}/vars/${VAR_NAME}"
            BODY=$(jq -n \
              --arg name "${VAR_NAME}" \
              --arg value "${VAR_VALUE}" \
              --arg sl "${SECURITY_LEVEL}" \
              '{"name":$name,"value":$value,"securityLevel":$sl}')
            ;;
          app-profile)
            URL="${BASE}/apps/${APP_NAME}/profiles/${PROFILE_NAME}/vars/${VAR_NAME}"
            BODY=$(jq -n \
              --arg name "${VAR_NAME}" \
              --arg value "${VAR_VALUE}" \
              --arg sl "${SECURITY_LEVEL}" \
              '{"name":$name,"value":$value,"securityLevel":$sl}')
            ;;
          *)
            echo "::error::Unknown scope '${SCOPE}'. Valid values: account, env, app, app-env, app-profile"
            exit 1
            ;;
        esac

        TMPFILE=$(mktemp)
        HTTP_CODE=$(curl -s -o "$TMPFILE" -w "%{http_code}" -X PUT \
          -H "X-Api-Key: ${API_KEY}" \
          -H "Content-Type: application/json" \
          -d "${BODY}" \
          "${URL}")
        RESPONSE=$(cat "$TMPFILE")
        rm -f "$TMPFILE"

        echo "Response (HTTP ${HTTP_CODE}):"
        echo "${RESPONSE}"

        if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
          echo "::error::HTTP request failed with status ${HTTP_CODE}"
          exit 1
        fi