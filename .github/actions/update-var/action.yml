name: Update config variable
description: Creates or updates a variable value in Powerimo Config service at a given scope

inputs:
  api-url:
    required: true
    description: Base URL of the config API (e.g. https://app.powerimo.cloud/config)
  api-key:
    required: true
    description: X-Api-Key value for authentication
  account-id:
    required: true
    description: Account UUID
  scope:
    required: false
    default: account
    description: "Variable scope: account | env | app | app-env | app-profile"
  var-name:
    required: true
    description: Variable name
  value:
    required: true
    description: New variable value
  security-level:
    required: false
    default: PUBLIC
    description: "Variable security level: PUBLIC | HIDDEN_BY_DEFAULT | ENCRYPTED"
  create:
    required: false
    default: "false"
    description: "Create the variable if it does not exist"
  update:
    required: false
    default: "true"
    description: "Update the variable if it already exists"
  description:
    required: false
    description: Optional human-readable description of the variable
  ignore-rv:
    required: false
    default: "false"
    description: "Skip optimistic locking revision check — use with caution"
  env-name:
    required: false
    description: Environment name (required for scope env or app-env)
  app-name:
    required: false
    description: Application name (required for scope app, app-env, or app-profile)
  profile-name:
    required: false
    description: Profile name (required for scope app-profile)

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        API_URL: ${{ inputs.api-url }}
        ACCOUNT_ID: ${{ inputs.account-id }}
        SCOPE: ${{ inputs.scope }}
        VAR_NAME: ${{ inputs.var-name }}
        VAR_VALUE: ${{ inputs.value }}
        VAR_DESCRIPTION: ${{ inputs.description }}
        SECURITY_LEVEL: ${{ inputs.security-level }}
        CREATE_VAR: ${{ inputs.create }}
        UPDATE_VAR: ${{ inputs.update }}
        IGNORE_RV: ${{ inputs.ignore-rv }}
        ENV_NAME: ${{ inputs.env-name }}
        APP_NAME: ${{ inputs.app-name }}
        PROFILE_NAME: ${{ inputs.profile-name }}
      run: |
        set -e

        BASE="${API_URL}/v1/account/${ACCOUNT_ID}"

        case "${SCOPE}" in
          account)
            URL="${BASE}/account-vars"
            ;;
          env)
            URL="${BASE}/envs/${ENV_NAME}/vars"
            ;;
          app)
            URL="${BASE}/apps/${APP_NAME}/vars"
            ;;
          app-env)
            URL="${BASE}/apps/${APP_NAME}/envs/${ENV_NAME}/vars"
            ;;
          app-profile)
            URL="${BASE}/apps/${APP_NAME}/profiles/${PROFILE_NAME}/vars"
            ;;
          *)
            echo "::error::Unknown scope '${SCOPE}'. Valid values: account, env, app, app-env, app-profile"
            exit 1
            ;;
        esac

        BODY=$(jq -n \
          --arg name "${VAR_NAME}" \
          --arg value "${VAR_VALUE}" \
          --arg description "${VAR_DESCRIPTION}" \
          --arg sl "${SECURITY_LEVEL}" \
          --argjson create "${CREATE_VAR}" \
          --argjson update "${UPDATE_VAR}" \
          --argjson ignoreRv "${IGNORE_RV}" \
          '{
            "name": $name,
            "value": $value,
            "securityLevel": $sl,
            "create": $create,
            "update": $update,
            "ignoreRv": $ignoreRv
          } + (if $description != "" then {"description": $description} else {} end)')

        TMPFILE=$(mktemp)
        set +e
        HTTP_CODE=$(curl -s -o "$TMPFILE" -w "%{http_code}" -X POST \
          -H "X-Api-Key: ${API_KEY}" \
          -H "Content-Type: application/json" \
          -d "${BODY}" \
          "${URL}")
        CURL_EXIT=$?
        set -e

        if [ "${CURL_EXIT}" -ne 0 ]; then
          case "${CURL_EXIT}" in
            6)  MSG="Could not resolve host" ;;
            7)  MSG="Failed to connect to host" ;;
            28) MSG="Operation timed out" ;;
            35) MSG="SSL connect error" ;;
            51) MSG="SSL certificate verification failed (peer cert not OK)" ;;
            52) MSG="Empty reply from server" ;;
            56) MSG="Failure receiving network data" ;;
            60) MSG="SSL certificate problem: cannot verify from trusted CA" ;;
            77) MSG="Problem reading SSL CA certificate" ;;
            *)  MSG="Request failed" ;;
          esac
          echo "::error::curl exited with code ${CURL_EXIT}: ${MSG}"
          rm -f "$TMPFILE"
          exit 1
        fi

        RESPONSE=$(cat "$TMPFILE")
        rm -f "$TMPFILE"

        echo "Response (HTTP ${HTTP_CODE}):"
        echo "${RESPONSE}"

        if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
          echo "::error::HTTP request failed with status ${HTTP_CODE}"
          exit 1
        fi
